      operationId: deleteCanvases_id_public_link
      tags: [access]
      description: Выключить публичную ссылку (slug → null).
      responses: { '204': { description: Выключена }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /notes/{id}/access:
    parameters: [{ $ref: '#/components/parameters/NoteId' }]
