name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (eslint, vue-tsc, prettier, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test

  backend:
    name: backend (php-cs-fixer + PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      # Аналог compose-сервиса test-postgres (R15): изолированная БД тестов.
      test-postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vistynq_test
          POSTGRES_USER: vistynq
          POSTGRES_PASSWORD: vistynq_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vistynq -d vistynq_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo, pdo_pgsql, sodium

      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('apps/backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --no-progress

      - run: composer run lint

      - name: Create .env for tests
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_URL=http://localhost:8000
          FRONTEND_URL=http://localhost:5173
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_NAME=vistynq_test
          DB_USER=vistynq
          DB_PASS=vistynq_test_password
          JWT_SECRET=test-secret-key-that-is-long-enough-for-hs256-ci
          ACCESS_TTL=900
          REFRESH_TTL=2592000
          S3_ENDPOINT=http://localhost:9000
          S3_REGION=us-east-1
          S3_BUCKET=vistynq-test
          S3_ACCESS_KEY=test-minio
          S3_SECRET_KEY=test-minio-secret
          S3_USE_PATH_STYLE=true
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USER=
          SMTP_PASS=
          MAIL_FROM=no-reply@vistynq.test
          COOKIE_DOMAIN=
          COOKIE_SECURE=false
          EOF

      - name: Run migrations
        run: php bin/migrate

      - run: vendor/bin/phpunit

  openapi-check:
    name: openapi check (redocly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npx --yes @redocly/cli@latest lint docs/openapi.yaml --config redocly.yaml

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Персональный репозиторий — GITLEAKS_LICENSE не требуется (нужен только для организаций).
      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Playwright E2E
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    services:
      # Изолированная БД для e2e — аналог compose-сервиса test-postgres (R15/R16).
      test-postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vistynq_test
          POSTGRES_USER: vistynq
          POSTGRES_PASSWORD: vistynq_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vistynq -d vistynq_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo, pdo_pgsql, sodium

      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('apps/backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --no-progress
        working-directory: apps/backend

      - name: Create .env for backend
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_URL=http://localhost:8000
          FRONTEND_URL=http://localhost:5173
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_NAME=vistynq_test
          DB_USER=vistynq
          DB_PASS=vistynq_test_password
          JWT_SECRET=test-secret-key-that-is-long-enough-for-hs256-ci
          ACCESS_TTL=900
          REFRESH_TTL=2592000
          S3_ENDPOINT=http://localhost:9000
          S3_REGION=us-east-1
          S3_BUCKET=vistynq-test
          S3_ACCESS_KEY=test-minio
          S3_SECRET_KEY=test-minio-secret
          S3_USE_PATH_STYLE=true
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USER=
          SMTP_PASS=
          MAIL_FROM=no-reply@vistynq.test
          COOKIE_DOMAIN=
          COOKIE_SECURE=false
          EOF
        working-directory: apps/backend

      - name: Run migrations
        run: php bin/migrate
        working-directory: apps/backend

      - name: Start backend server
        run: php -S 127.0.0.1:8000 -t public public/index.php &
        working-directory: apps/backend

      - name: Start frontend dev server
        run: pnpm run dev &
        working-directory: apps/frontend

      # Без ожидания Playwright стартует до готовности серверов и падает на race.
      - name: Wait for backend
        run: timeout 30 bash -c 'until curl -sf http://127.0.0.1:8000/healthz; do sleep 1; done'

      - name: Wait for frontend
        run: timeout 60 bash -c 'until curl -sf http://127.0.0.1:5173/; do sleep 1; done'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: apps/frontend

      - name: Run Playwright E2E
        run: npx playwright test
        working-directory: apps/frontend
        env:
          # Target без пути: vite-прокси сам добавляет /api/... из запроса.
          VITE_API_TARGET: http://localhost:8000
