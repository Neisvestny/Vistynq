name: vistynq

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vistynq}
      POSTGRES_USER: ${POSTGRES_USER:-vistynq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vistynq_dev_password}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vistynq-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vistynq-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
      S3_BUCKET: ${S3_BUCKET:-vistynq-media}
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing "local/$${S3_BUCKET}" && mc anonymous set none "local/$${S3_BUCKET}"
    restart: 'no'

  mailpit:
    image: axllent/mailpit
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8025/livez || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:8000:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/api/v1/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./apps/backend
    environment:
      APP_ENV: dev
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${POSTGRES_DB:-vistynq}
      DB_USER: ${POSTGRES_USER:-vistynq}
      DB_PASS: ${POSTGRES_PASSWORD:-vistynq_dev_password}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      ACCESS_TTL: '900'
      REFRESH_TTL: '2592000'
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-vistynq-media}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-vistynq-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
      S3_USE_PATH_STYLE: 'true'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@vistynq.local}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: 'false'
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    volumes:
      - ./apps/backend:/app
      - backend_vendor:/app/vendor
      - composer-cache:/tmp/composer-cache
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'php -r "exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);"']
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      VITE_API_TARGET: http://nginx:80
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - frontend_node_modules:/app/apps/frontend/node_modules
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  pgdata:
  minio-data:
  backend_vendor:
  composer-cache:
  root_node_modules:
  frontend_node_modules: